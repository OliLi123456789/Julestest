name: WebApp Frontend CI/CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # For versioned releases
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+' # For release candidates, e.g. v1.0.0-rc.1
    paths:
      - 'webapp/frontend/**'
      - '.github/workflows/webapp_frontend_ci_cd.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'webapp/frontend/**'
      - '.github/workflows/webapp_frontend_ci_cd.yml'

env:
  NODE_VERSION: '18.x'
  AWS_REGION: 'us-east-1' # Default region, can be overridden by secrets if staging/prod are different

permissions:
  id-token: write
  contents: read

jobs:
  lint_and_test:
    name: Lint and Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Add linting step if a lint script is configured in package.json
      # - name: Run ESLint
      #   run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false

  build_assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: lint_and_test
    defaults:
      run:
        working-directory: ./webapp/frontend
    outputs:
      build_artifact_name: ${{ steps.artifact_info.outputs.artifact_name }}
      build_config_env: ${{ steps.build_env.outputs.build_config_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine Build Environment and Set API URL
        id: build_env
        run: |
          CURRENT_BRANCH_OR_TAG="${{ github.ref_name }}" # GITHUB_REF_NAME gives branch or tag name
          echo "Current branch or tag: ${CURRENT_BRANCH_OR_TAG}"
          BUILD_CONFIG_ENV="staging" # Default to staging for PRs to develop or develop branch
          API_URL="${{ secrets.STAGING_LLM_CHATBOT_URL }}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${CURRENT_BRANCH_OR_TAG}" == "main" || ($CURRENT_BRANCH_OR_TAG == v* && $CURRENT_BRANCH_OR_TAG != *rc*) ]]; then
              BUILD_CONFIG_ENV="production"
              API_URL="${{ secrets.PRODUCTION_LLM_CHATBOT_URL }}"
            elif [[ "${CURRENT_BRANCH_OR_TAG}" == "develop" || $CURRENT_BRANCH_OR_TAG == *rc* ]]; then
              BUILD_CONFIG_ENV="staging" # Already default, but explicit
              API_URL="${{ secrets.STAGING_LLM_CHATBOT_URL }}"
            fi
          fi
          echo "BUILD_CONFIG_ENV is ${BUILD_CONFIG_ENV}"
          echo "build_config_env=${BUILD_CONFIG_ENV}" >> $GITHUB_OUTPUT
          echo "REACT_APP_LLM_CHATBOT_SERVICE_URL=${API_URL}" >> $GITHUB_ENV


      - name: Build static assets
        run: npm run build
        env:
           # This ensures the build uses the correct API URL based on the branch/tag
           REACT_APP_LLM_CHATBOT_SERVICE_URL: ${{ env.REACT_APP_LLM_CHATBOT_SERVICE_URL }}

      - name: Archive build artifacts
        id: artifact_info # Give this step an ID to reference its outputs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ steps.build_env.outputs.build_config_env }}-${{ github.sha }}
          path: webapp/frontend/build/
          retention-days: 7

      - name: Output artifact name # For debugging/logging
        run: echo "Artifact name is frontend-build-${{ steps.build_env.outputs.build_config_env }}-${{ github.sha }}"


  deploy_to_staging_s3:
    name: Deploy Frontend to Staging S3
    runs-on: ubuntu-latest
    needs: build_assets
    # Deploy if it's a push to 'develop', or an 'rc' tag
    if: github.event_name == 'push' && (github.ref_name == 'develop' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')))

    environment:
      name: staging_frontend
      url: ${{ secrets.STAGING_FRONTEND_URL }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_assets.outputs.build_artifact_name }}
          path: ./build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN_WEBAPP }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Staging S3
        run: |
          aws s3 sync ./build s3://${{ secrets.STAGING_FRONTEND_S3_BUCKET_NAME }} --delete --acl public-read
          echo "Synced to s3://${{ secrets.STAGING_FRONTEND_S3_BUCKET_NAME }}"

      - name: Invalidate Staging CloudFront Cache
        if: secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "CloudFront invalidation requested for ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}"

  deploy_to_production_s3:
    name: Deploy Frontend to Production S3
    runs-on: ubuntu-latest
    needs: build_assets
    # Deploy if it's a push to 'main', or a non-RC tag
    if: github.event_name == 'push' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')))

    environment:
      name: production_frontend
      url: ${{ secrets.PRODUCTION_FRONTEND_URL }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_assets.outputs.build_artifact_name }}
          path: ./build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN_WEBAPP }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Production S3
        run: |
          aws s3 sync ./build s3://${{ secrets.PRODUCTION_FRONTEND_S3_BUCKET_NAME }} --delete --acl public-read
          echo "Synced to s3://${{ secrets.PRODUCTION_FRONTEND_S3_BUCKET_NAME }}"

      - name: Invalidate Production CloudFront Cache
        if: secrets.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "CloudFront invalidation requested for ${{ secrets.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }}"
