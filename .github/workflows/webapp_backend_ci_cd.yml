name: WebApp Backend CI/CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
    paths:
      - 'webapp/backend/**'
      - '.github/workflows/webapp_backend_ci_cd.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'webapp/backend/**'
      - '.github/workflows/webapp_backend_ci_cd.yml'

env:
  PYTHON_VERSION: '3.10'
  AWS_REGION: 'us-east-1' # Or your default AWS region, can be overridden by secrets for specific environments
  # ECR_REPOSITORY_WEBAPP_BACKEND should be just the name like 'staging-webapp-backend' or 'prod-webapp-backend'
  # This will be stored as a GitHub Secret secrets.ECR_REPOSITORY_WEBAPP_BACKEND (or env-specific like secrets.STAGING_ECR_REPO_WEBAPP_BACKEND)

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint WebApp Backend Code
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./webapp/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - name: Install lint deps
        run: pip install flake8 black
      - name: Run Black (Check)
        run: black --check .
      - name: Run Flake8
        run: flake8 .

  unit_test:
    name: Run WebApp Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults: { run: { working-directory: ./webapp/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - name: Install dependencies
        run: pip install -r requirements.txt # Assuming test deps are in main requirements
      - name: Run Pytest
        run: pytest # Assuming tests are in a 'tests' subdir or discoverable

  build_scan_and_push_image:
    name: Build, Scan, Push WebApp Backend Image
    runs-on: ubuntu-latest
    needs: unit_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      image_sha_tag: ${{ steps.image_tags.outputs.image_sha_tag }}
      image_context_tag: ${{ steps.image_tags.outputs.image_context_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN_WEBAPP_BACKEND }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Define Image Tags
        id: image_tags
        env:
          # ECR_REPOSITORY_NAME_STAGING and ECR_REPOSITORY_NAME_PROD would be secrets
          # containing the specific ECR repo names for each environment.
          # Or, if using one ECR repo with different tags, adjust logic.
          # For this example, we assume a single ECR_REPOSITORY_WEBAPP_BACKEND secret that
          # contains the *base* name, and we might prepend env if needed, or it's already env-specific.
          # Let's assume secrets.ECR_REPOSITORY_WEBAPP_BACKEND is the env-specific name for simplicity.
          ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_WEBAPP_BACKEND }}
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA_TAG_BASE="${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}"
          IMAGE_SHA_TAG=""
          IMAGE_CONTEXT_TAG=""

          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            IMAGE_SHA_TAG="${IMAGE_SHA_TAG_BASE}:develop-${{ github.sha }}"
            IMAGE_CONTEXT_TAG="${IMAGE_SHA_TAG_BASE}:develop-latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            IMAGE_SHA_TAG="${IMAGE_SHA_TAG_BASE}:main-${{ github.sha }}"
            IMAGE_CONTEXT_TAG="${IMAGE_SHA_TAG_BASE}:latest"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG=$(echo "${{ github.ref }}" | sed 's|refs/tags/||')
            IMAGE_SHA_TAG="${IMAGE_SHA_TAG_BASE}:${VERSION_TAG}-${{ github.sha }}"
            IMAGE_CONTEXT_TAG="${IMAGE_SHA_TAG_BASE}:${VERSION_TAG}"
          else
            echo "Error: Branch or tag not configured for ECR push." >&2
            exit 1
          fi
          echo "image_sha_tag=${IMAGE_SHA_TAG}" >> $GITHUB_OUTPUT
          echo "image_context_tag=${IMAGE_CONTEXT_TAG}" >> $GITHUB_OUTPUT
          echo "Determined Image SHA Tag: ${IMAGE_SHA_TAG}"
          echo "Determined Image Context Tag: ${IMAGE_CONTEXT_TAG}"
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp/backend
          file: ./webapp/backend/Dockerfile
          push: false
          tags: ${{ steps.image_tags.outputs.image_sha_tag }}
          load: true
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_tags.outputs.image_sha_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.image_tags.outputs.image_sha_tag }}
          if [[ -n "${{ steps.image_tags.outputs.image_context_tag }}" ]]; then
            docker tag ${{ steps.image_tags.outputs.image_sha_tag }} ${{ steps.image_tags.outputs.image_context_tag }}
            docker push ${{ steps.image_tags.outputs.image_context_tag }}
            echo "Also pushed context tag: ${{ steps.image_tags.outputs.image_context_tag }}"
          fi

  deploy_to_staging:
    name: Deploy WebApp Backend to Staging
    runs-on: ubuntu-latest
    needs: build_scan_and_push_image
    if: github.event_name == 'push' && (github.ref_name == 'develop' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')))
    environment: { name: staging_webapp_backend } # Define this environment in GitHub settings
    steps:
      - uses: actions/checkout@v4 # Checkout code to access task definition template
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN_WEBAPP_BACKEND }}, aws-region: ${{ env.AWS_REGION }} }
      - name: Fill Staging Task Definition
        id: task_def_staging_updated
        env:
          IMAGE_URI: ${{ needs.build_scan_and_push_image.outputs.image_context_tag }}
          STAGING_ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.STAGING_ECS_TASK_EXECUTION_ROLE_ARN }}
          STAGING_WEBAPP_BACKEND_TASK_ROLE_ARN: ${{ secrets.STAGING_WEBAPP_BACKEND_TASK_ROLE_ARN }}
          STAGING_LOG_GROUP_NAME: "/ecs/${{ secrets.STAGING_ENVIRONMENT_NAME || 'staging' }}/webapp-backend"
          AWS_REGION_ENV: ${{ env.AWS_REGION }}
          STAGING_LLM_CHATBOT_URL_ENV: ${{ secrets.STAGING_LLM_CHATBOT_URL }} # For LLM_CHATBOT_SERVICE_URL
          STAGING_DATABASE_SECRET_ARN_ENV: ${{ secrets.STAGING_DATABASE_SECRET_ARN }} # For DATABASE_SECRET_ARN
        run: |
          TEMP_TASK_DEF_FILE="task-def-staging-updated.json"
          cp ./webapp/backend/ecs/staging-task-def.json ${TEMP_TASK_DEF_FILE}
          sed -i "s|PLACEHOLDER_IMAGE_URI|${IMAGE_URI}|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|PLACEHOLDER_STAGING_ECS_TASK_EXECUTION_ROLE_ARN|${STAGING_ECS_TASK_EXECUTION_ROLE_ARN}|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|PLACEHOLDER_STAGING_WEBAPP_BACKEND_TASK_ROLE_ARN|${STAGING_WEBAPP_BACKEND_TASK_ROLE_ARN}|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|/ecs/staging/webapp-backend|${STAGING_LOG_GROUP_NAME}|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|\"awslogs-region\": \"REPLACE_AWS_REGION\"|\"awslogs-region\": \"${AWS_REGION_ENV}\"|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|http://REPLACE_WITH_STAGING_LLM_CHATBOT_ALB_DNS_OR_SERVICE_DISCOVERY_NAME:8001|${STAGING_LLM_CHATBOT_URL_ENV}|g" ${TEMP_TASK_DEF_FILE}
          sed -i "s|arn:aws:secretsmanager:REPLACE_AWS_REGION:REPLACE_AWS_ACCOUNT_ID:secret:staging/webapp-backend/database_credentials-XXXXXX|${STAGING_DATABASE_SECRET_ARN_ENV}|g" ${TEMP_TASK_DEF_FILE}
          echo "task_def_path=${TEMP_TASK_DEF_FILE}" >> $GITHUB_OUTPUT
          cat ${TEMP_TASK_DEF_FILE}
      - name: Register Staging ECS Task Definition
        id: register-task-def-staging
        run: |
          aws ecs register-task-definition --cli-input-json file://${{ steps.task_def_staging_updated.outputs.task_def_path }} > output_staging.json
          TASK_DEFINITION_ARN_STAGING=$(cat output_staging.json | jq -r .taskDefinition.taskDefinitionArn)
          echo "task_definition_arn_staging=${TASK_DEFINITION_ARN_STAGING}" >> $GITHUB_OUTPUT
          if [ -z "${TASK_DEFINITION_ARN_STAGING}" ] || [ "${TASK_DEFINITION_ARN_STAGING}" == "null" ]; then exit 1; fi
      - name: Update Staging ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.STAGING_ECS_CLUSTER_NAME }} \
            --service ${{ secrets.STAGING_WEBAPP_BACKEND_ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task-def-staging.outputs.task_definition_arn_staging }} \
            --force-new-deployment

  deploy_to_production:
    name: Deploy WebApp Backend to Production
    runs-on: ubuntu-latest
    needs: build_scan_and_push_image
    if: github.event_name == 'push' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')))
    environment: { name: production_webapp_backend } # Requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN_WEBAPP_BACKEND }}, aws-region: ${{ env.AWS_REGION }} } # Or PROD_AWS_REGION
      - name: Determine Prod Image URI
        id: prod_image
        run: echo "image_uri=${{ needs.build_scan_and_push_image.outputs.image_context_tag }}" >> $GITHUB_OUTPUT
      - name: Fill Production Task Definition
        id: task_def_prod_updated
        env:
          IMAGE_URI: ${{ steps.prod_image.outputs.image_uri }}
          PROD_ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.PROD_ECS_TASK_EXECUTION_ROLE_ARN }}
          PROD_WEBAPP_BACKEND_TASK_ROLE_ARN: ${{ secrets.PROD_WEBAPP_BACKEND_TASK_ROLE_ARN }}
          PROD_LOG_GROUP_NAME: "/ecs/${{ secrets.PROD_ENVIRONMENT_NAME || 'production' }}/webapp-backend"
          AWS_REGION_ENV: ${{ env.AWS_REGION }} # Or secrets.PROD_AWS_REGION
          PROD_LLM_CHATBOT_URL_ENV: ${{ secrets.PROD_LLM_CHATBOT_URL }}
          PROD_DATABASE_SECRET_ARN_ENV: ${{ secrets.PROD_DATABASE_SECRET_ARN }}
        run: |
          TEMP_TASK_DEF_FILE_PROD="task-def-prod-updated.json"
          cp ./webapp/backend/ecs/production-task-def.json ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|PLACEHOLDER_IMAGE_URI|${IMAGE_URI}|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|PLACEHOLDER_PROD_ECS_TASK_EXECUTION_ROLE_ARN|${PROD_ECS_TASK_EXECUTION_ROLE_ARN}|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|PLACEHOLDER_PROD_WEBAPP_BACKEND_TASK_ROLE_ARN|${PROD_WEBAPP_BACKEND_TASK_ROLE_ARN}|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|/ecs/production/webapp-backend|${PROD_LOG_GROUP_NAME}|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|\"awslogs-region\": \"REPLACE_AWS_REGION\"|\"awslogs-region\": \"${AWS_REGION_ENV}\"|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|http://REPLACE_WITH_PRODUCTION_LLM_CHATBOT_ALB_DNS_OR_SERVICE_DISCOVERY_NAME:8001|${PROD_LLM_CHATBOT_URL_ENV}|g" ${TEMP_TASK_DEF_FILE_PROD}
          sed -i "s|arn:aws:secretsmanager:REPLACE_AWS_REGION:REPLACE_AWS_ACCOUNT_ID:secret:production/webapp-backend/database_credentials-XXXXXX|${PROD_DATABASE_SECRET_ARN_ENV}|g" ${TEMP_TASK_DEF_FILE_PROD}
          echo "task_def_path=${TEMP_TASK_DEF_FILE_PROD}" >> $GITHUB_OUTPUT
          cat ${TEMP_TASK_DEF_FILE_PROD}
      - name: Register Production ECS Task Definition
        id: register-task-def-prod
        run: |
          aws ecs register-task-definition --cli-input-json file://${{ steps.task_def_prod_updated.outputs.task_def_path }} > output_prod.json
          TASK_DEFINITION_ARN_PROD=$(cat output_prod.json | jq -r .taskDefinition.taskDefinitionArn)
          echo "task_definition_arn_prod=${TASK_DEFINITION_ARN_PROD}" >> $GITHUB_OUTPUT
          if [ -z "${TASK_DEFINITION_ARN_PROD}" ] || [ "${TASK_DEFINITION_ARN_PROD}" == "null" ]; then exit 1; fi
      - name: Update Production ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.PROD_ECS_CLUSTER_NAME }} \
            --service ${{ secrets.PROD_WEBAPP_BACKEND_ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task-def-prod.outputs.task_definition_arn_prod }} \
            --force-new-deployment
