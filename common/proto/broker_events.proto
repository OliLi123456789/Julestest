// common/proto/broker_events.proto
syntax = "proto3";

package broker_events;

// Assuming Go and Python generated code will be placed in these locations
// relative to a common 'prop-firm-platform' root or a shared 'common' module.
option go_package = "prop-firm-platform/common/gen/go/broker_events;broker_events";
option python_package = "common.gen.python.broker_events"; // For Python import structure

import "google/protobuf/timestamp.proto";

// BrokerInstrument can be used by multiple event types.
// It represents key details of a financial instrument as understood by the broker.
message BrokerInstrument {
  string symbol            = 1;    // e.g., AAPL, EUR, BTC
  string sec_type          = 2;    // STK, OPT, FUT, CASH, CRYPTO etc. (IBKR specific usually)
  string exchange          = 3;    // Target exchange, e.g., SMART, NASDAQ, CME, IDEALPRO, PAXOS
  string currency          = 4;    // e.g., USD, EUR
  int64  con_id            = 5;    // Interactive Brokers Contract ID (if available and resolved)
  string last_trade_date_or_contract_month = 6; // YYYYMM or YYYYMMDD
  double strike            = 7;    // For OPT/FOP
  string right             = 8;    // "C" or "P" for OPT/FOP
  string multiplier        = 9;    // For OPT/FUT
  string primary_exchange  = 10;   // For STK on SMART, e.g., ISLAND, NYSE
  // string local_symbol   = 11;   // If different from symbol
  // string trading_class  = 12;
}

message OrderStatusEvent {
  string platform_order_id = 1;  // Platform's unique internal order ID
  int64  broker_order_id   = 2;  // IBKR's orderId (client-side)
  int32  perm_id           = 3;  // IBKR's permId (permanent, globally unique ID)
  string status            = 4;  // e.g., PendingSubmit, ApiPending, PendingCancel, PreSubmitted, Submitted, ApiCancelled, Cancelled, Filled, Inactive
  double filled_quantity   = 5;
  double remaining_quantity = 6;
  double average_fill_price = 7;
  double last_fill_price   = 8;  // Price of the last partial fill
  int32  client_id         = 9;  // IBKR TWS client ID that managed this order
  string why_held          = 10; // Reason if order is held by IB (e.g., "locate")
  double mkt_cap_price     = 11; // For peg-to-market-cap orders
  google.protobuf.Timestamp event_timestamp_utc = 12; // When this status event was generated/processed by our service
  string ib_account_id     = 13; // IBKR Account ID this order belongs to
  // string parent_broker_order_id = 14; // If part of a parent/child order structure
}

message CommissionReportData {
    string execution_id       = 1; // Links to ExecutionReportEvent.execution_id
    double commission         = 2;
    string currency           = 3;
    double realized_pnl       = 4;
    double yield              = 5; // If applicable (e.g., for bonds)
    int32  yield_redemption_date = 6; // YYYYMMDD format as integer (or string)
}

message ExecutionReportEvent {
  string platform_order_id = 1;  // Platform's internal order ID
  int64  broker_order_id   = 2;  // IBKR's orderId
  string execution_id      = 3;  // IBKR's execId (unique for each fill segment)
  int32  perm_id           = 15; // IBKR's permId for the order
  BrokerInstrument instrument = 4;
  string side              = 5;  // "BOT" or "SLD"
  double filled_quantity   = 6;  // Shares/contracts in this specific fill segment
  double fill_price        = 7;
  string execution_time_str= 8;  // From IBKR (e.g., "YYYYMMDD  HH:MM:SS" - often in TWS local time or specific TZ)
  string executing_exchange= 9;  // Actual execution exchange if different from order's exchange
  string currency          = 10; // From contract usually, but good to have
  CommissionReportData commission_data = 11; // Optional, can be linked later or included if available with exec
  google.protobuf.Timestamp event_timestamp_utc = 12; // When this event was generated/processed by our service
  string ib_account_id     = 13; // IBKR Account ID
  double average_price     = 14; // Average price of all fills for this orderId (cumQty/avgPx from execution object)
  double cumulative_quantity = 16; // Cumulative quantity filled for this orderId
}

message AccountSummaryValue {
    string tag      = 1;
    string value    = 2;
    string currency = 3;
    string account_id = 4; // The account this tag belongs to
}

// Event for snapshot style account summary (from reqAccountSummary)
message AccountSummarySnapshotEvent {
  string account_id_filter = 1; // The account requested (or "All" for all subscribed)
  map<string, AccountSummaryValue> summary_values = 2; // Keyed by tag (e.g., "NetLiquidation", "BuyingPower")
  google.protobuf.Timestamp event_timestamp_utc = 3;
  bool   is_snapshot_end = 4; // True if from accountSummaryEnd, indicating this snapshot is complete for the reqId
  int32  request_id = 5;      // reqId from original request if applicable
}

// Event for continuous account value updates (from updateAccountValue)
message AccountValueUpdateEvent {
    string account_id = 1;
    string key        = 2; // The specific account key being updated (e.g., "TotalCashValue")
    string value      = 3;
    string currency   = 4;
    google.protobuf.Timestamp event_timestamp_utc = 5;
}

message PortfolioUpdateEvent {
  string ib_account_id = 1;
  BrokerInstrument instrument = 2;
  double position          = 3; // Can be float for some instruments
  double market_price      = 4;
  double market_value      = 5;
  double average_cost      = 6;
  double unrealized_pnl    = 7;
  double realized_pnl      = 8; // Realized PNL for this specific position/contract (usually 0 unless closed)
  google.protobuf.Timestamp event_timestamp_utc = 9;
}

message BrokerErrorEvent {
    int32  request_id = 1; // reqId from IBKR if applicable (-1 for general/system errors)
    int32  error_code = 2;
    string error_message = 3;
    string advanced_order_reject_json = 4; // Optional: advanced error details if provided
    google.protobuf.Timestamp event_timestamp_utc = 5;
    string source_client_id = 6; // IBKR Client ID that generated/received the error
}
